<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Music Search</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <main class="main-page">

    <h1>Search Music</h1>


    <!-- SEARCH -->

    <form
      class="search-bar"
      id="searchForm"
    >

      <input
        id="searchInput"
        type="text"
        placeholder="Search for a song or artist..."
        aria-label="Search for music"
      >

      <button type="submit">
        Search
      </button>

    </form>


    <!-- MUSIC GENRES -->

    <div class="challenges">

      <button
        type="button"
        data-challenge="pop"
      >
        <span class="genre-icon">🎤</span>
        <span>Pop</span>
      </button>


      <button
        type="button"
        data-challenge="rock"
      >
        <span class="genre-icon">🎸</span>
        <span>Rock</span>
      </button>


      <button
        type="button"
        data-challenge="jazz"
      >
        <span class="genre-icon">🎷</span>
        <span>Jazz</span>
      </button>


      <button
        type="button"
        data-challenge="hip hop"
      >
        <span class="genre-icon">🎧</span>
        <span>Hip-Hop</span>
      </button>

    </div>


    <!-- LOADING -->

    <div
      id="loading"
      class="loading"
    >
      Loading music...
    </div>


    <!-- RESULTS -->

    <section
      id="results"
      class="results"
    ></section>

  </main>


  <!-- LAST.FM API KEY -->

  <script src="config.js"></script>

  <!-- APPLICATION -->

  <script src="script.js"></script>

</body>

</html>
